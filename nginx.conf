server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend-core:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Imágenes y fuentes: cache largo, rara vez cambian.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML/CSS/JS: revalidar siempre (con ETag → 304 si no cambió), para que
    # los despliegues se reflejen sin que el usuario tenga que hacer hard refresh.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
