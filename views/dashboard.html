<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BIG O | Console</title>
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@450&family=Geist:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body class="flex min-h-screen bg-background text-on-surface">
    <aside class="h-screen w-64 fixed left-0 top-0 bg-surface-container-low border-r border-outline-variant/20 flex flex-col py-stack-lg z-40 hidden md:flex">
      <div class="px-container-margin mb-stack-lg"><a href="/index.html" class="font-headline-md text-headline-md font-bold text-primary-fixed-dim">BIG O</a></div>
      <nav class="flex-1 px-4"><a class="flex items-center gap-3 px-4 py-3 bg-primary-container/10 text-primary-fixed-dim border-r-4 border-primary-fixed-dim" href="#"><span class="material-symbols-outlined">dashboard</span><span class="font-label-xs uppercase tracking-widest">Overview</span></a></nav>
      <div class="px-4 mt-auto space-y-4 border-t border-outline-variant/20 pt-4">
        <div class="flex flex-col"><span id="user-name" class="font-body-sm text-on-surface">Loading…</span><span id="user-email" class="text-[10px] text-on-surface-variant"></span></div>
        <button data-nav="logout" class="w-full flex items-center gap-3 px-4 py-3 text-error hover:bg-error-container/10 rounded-lg"><span class="material-symbols-outlined">logout</span><span class="font-label-xs uppercase tracking-widest">Cerrar sesión</span></button>
      </div>
    </aside>
    <main class="flex-1 md:ml-64 min-h-screen px-container-margin py-stack-lg">
      <header class="flex flex-col sm:flex-row justify-between gap-4 mb-stack-lg">
        <div><h1 class="font-headline-md text-primary">Overview</h1><p class="text-on-surface-variant">Tus bases de datos administradas.</p></div>
        <button id="open-provision-dialog" class="bg-primary-container text-on-primary-container px-6 py-2 rounded-lg font-title-sm hover:brightness-110 flex items-center gap-2"><span class="material-symbols-outlined">add</span>Provision New DB</button>
      </header>
      <p id="dashboard-message" class="hidden mb-4 text-error" role="alert"></p>
      <p id="database-limit" class="hidden mb-4 text-on-surface-variant" role="status"></p>
      <section id="engine-metrics" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-gutter mb-stack-lg" aria-label="Database engine metrics"></section>
      <section><div class="flex items-center justify-between mb-stack-md"><h2 class="font-title-sm text-on-surface">Active Databases</h2><span id="database-total" class="text-on-surface-variant text-sm"></span></div><div id="database-list" class="space-y-gutter"></div></section>
    </main>
    <dialog id="provision-dialog" class="bg-surface-container text-on-surface rounded-xl p-6 w-full max-w-md border border-outline-variant/30">
      <form id="provision-form" class="space-y-4"><div class="flex justify-between items-center"><h2 class="text-xl font-bold text-primary">Provision database</h2><button type="button" data-close-dialog class="text-on-surface-variant">×</button></div><label class="block">Engine<select id="engine" name="engine" class="mt-1 block w-full rounded bg-surface-container-high border-outline-variant" required></select></label><label class="hidden block">API key<input id="api-key" name="apiKey" type="password" placeholder="X-API-Key" class="mt-1 block w-full rounded bg-surface-container-high border-outline-variant" autocomplete="off" disabled /></label><label class="block">Database name<input id="database-name" name="databaseName" pattern="[a-z][a-z0-9_]{2,62}" class="mt-1 block w-full rounded bg-surface-container-high border-outline-variant" required /></label><p id="provision-progress" class="hidden text-primary-fixed-dim" role="status"></p><p id="provision-message" class="hidden text-error" role="alert"></p><button id="provision-submit" type="submit" class="w-full bg-primary-container text-on-primary-container py-2 rounded-lg">Create database</button></form>
    </dialog>
    <dialog id="credentials-dialog" class="bg-surface-container text-on-surface rounded-xl p-6 w-full max-w-md border border-outline-variant/30"><div class="space-y-3"><h2 class="text-xl font-bold text-primary">Save these credentials now</h2><p class="text-on-surface-variant text-sm">This password will not be shown again.</p><pre id="credentials-content" class="p-3 rounded bg-surface-container-high text-xs whitespace-pre-wrap"></pre><button id="copy-credentials" class="w-full bg-primary-container text-on-primary-container py-2 rounded-lg">Copy credentials</button><button data-close-dialog class="w-full py-2 text-on-surface-variant">Close</button></div></dialog>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
