<!doctype html>
<!--
  BIG O — Login page (login.html)
  ---------------------------------------------------------------------
  Structure:
    <header> Minimal top bar: brand mark + Docs link (no full nav, this
             is a transactional/auth screen)
    <main>   Centered glass card:
               - Title / subtitle
               - Email + password form (mock submit, see js/login.js)
               - OAuth (GitHub / Google) buttons (decorative, no backend)
               - Link to register.html for new users
  Shared styling lives in css/base.css and css/components.css.
  Shared Tailwind design tokens live in js/tailwind-config.js.
  Page-specific behaviour lives in js/login.js (on successful mock
  sign-in, redirects to dashboard.html).
  Linked pages: index.html, register.html, dashboard.html.
-->
<html lang="en" class="dark" style="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Geist:wght@600;700;800&amp;family=JetBrains+Mono:wght@450&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <script src="/js/tailwind-config.js"></script>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container"
  >
    <!-- Ambient background layer (currently empty, reserved for a future animated backdrop) -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-40"></div>
    <!-- Top bar: brand mark (links home) + Docs link -->
    <header
      class="top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin py-stack-md backdrop-blur-xl border-b border-outline-variant/30 bg-surface-container-lowest/80"
    >
      <div class="flex items-center gap-gutter">
        <a
          href="/index.html"
          class="font-headline-md text-headline-md font-black tracking-tighter text-primary-fixed-dim"
          >BIG O</a
        >
      </div>
      <div class="flex items-center gap-stack-md">
        <a
          class="font-label-xs text-label-xs text-on-surface-variant hover:text-primary-fixed transition-all duration-300"
          href="#"
          >Docs</a
        >
      </div>
    </header>
    <!-- Centered auth card: identity blurb, sign-in form, OAuth options, sign-up link -->
    <main
      class="relative z-10 flex-grow flex items-center justify-center p-container-margin min-h-screen"
    >
      <div
        class="w-full max-w-[400px] glass-panel p-stack-lg rounded-xl flex flex-col gap-stack-lg relative overflow-hidden"
      >
        <!-- Atmospheric Glow behind card -->
        <div
          class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container/10 blur-[80px] rounded-full"
        ></div>
        <!-- Card heading: title + supporting copy -->
        <div class="flex flex-col gap-unit">
          <h1 class="font-headline-md text-headline-md text-primary-fixed-dim">
            System Access
          </h1>
          <p class="font-body-sm text-body-sm text-on-surface-variant">
            Initialize developer session to BIG O clusters.
          </p>
        </div>
        <!-- Email/password form. Submission is mocked in js/login.js (no real backend) -->
        <form
          class="flex flex-col gap-gutter"
          novalidate
          onsubmit="event.preventDefault()"
        >
          <div class="flex flex-col gap-stack-sm">
            <label
              class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-wider"
              for="email"
              >Email Address</label
            >
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <span class="material-symbols-outlined text-[18px] text-outline"
                  >alternate_email</span
                >
              </div>
              <input
                class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-sm text-body-sm rounded-lg py-3 pl-10 pr-4 focus:ring-0 focus:border-primary-fixed-dim transition-colors neon-glow outline-none placeholder:text-outline-variant/50"
                id="email"
                name="email"
                placeholder="dev@big-o.systems"
                type="email"
                autocomplete="email"
                required
              />
            </div>
          </div>
          <div class="flex flex-col gap-stack-sm">
            <div class="flex justify-between items-center">
              <label
                class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-wider"
                for="password"
                >Password</label
              >
              <a
                class="font-label-xs text-label-xs text-primary-fixed-dim hover:text-primary transition-colors"
                href="#"
                >Forgot password?</a
              >
            </div>
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <span class="material-symbols-outlined text-[18px] text-outline"
                  >lock</span
                >
              </div>
              <input
                class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-body-sm text-body-sm rounded-lg py-3 pl-10 pr-4 focus:ring-0 focus:border-primary-fixed-dim transition-colors neon-glow outline-none placeholder:text-outline-variant/50"
                id="password"
                name="password"
                placeholder="••••••••"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>
          <!-- Zona de mensajes de error/estado; oculta hasta que login.js la use -->
          <p
            id="form-message"
            role="alert"
            class="hidden font-body-sm text-body-sm text-red-400 text-center"
          ></p>
          <button
            class="mt-2 w-full bg-primary-fixed-dim hover:bg-primary-fixed text-on-primary-fixed font-bold py-3 px-6 rounded-lg transition-all duration-300 btn-hover-glow active:scale-[0.98] flex items-center justify-center gap-stack-sm"
            type="submit"
          >
            <span class="font-label-xs text-label-xs uppercase tracking-widest"
              >Sign In</span
            >
            <span class="material-symbols-outlined text-[20px]">login</span>
          </button>
        </form>
        <!-- "or continue with" divider -->
        <div class="flex items-center gap-stack-md">
          <div class="flex-grow h-[1px] bg-outline-variant/30"></div>
          <span
            class="font-label-xs text-label-xs text-outline-variant uppercase tracking-widest"
            >or continue with</span
          >
          <div class="flex-grow h-[1px] bg-outline-variant/30"></div>
        </div>
        <!-- OAuth: navegación directa al backend (inicia el flujo Google/GitHub). -->
        <div class="grid grid-cols-2 gap-gutter">
          <a
            id="oauth-github"
            href="/api/auth/github"
            class="flex items-center justify-center gap-stack-sm bg-surface-container-lowest border border-outline-variant/30 py-3 rounded-lg font-label-xs text-label-xs text-on-surface-variant hover:text-on-surface hover:border-outline-variant/60 transition-all duration-300"
          >
            <svg
              class="w-5 h-5 shrink-0"
              viewBox="0 0 24 24"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
              ></path></svg
            >GitHub
          </a>
          <a
            id="oauth-google"
            href="/api/auth/google"
            class="flex items-center justify-center gap-stack-sm bg-surface-container-lowest border border-outline-variant/30 py-3 rounded-lg font-label-xs text-label-xs text-on-surface-variant hover:text-on-surface hover:border-outline-variant/60 transition-all duration-300"
          >
            <svg
              class="w-5 h-5 shrink-0"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              ></path>
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              ></path>
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#FBBC05"
              ></path>
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              ></path></svg
            >Google
          </a>
        </div>
        <!-- Link to the registration page for new users -->
        <div class="pt-stack-sm text-center">
          <p class="font-body-sm text-body-sm text-on-surface-variant">
            New user?
            <a
              class="text-primary-fixed-dim hover:text-primary font-bold transition-colors"
                href="/views/register.html"
              >Create local account</a
            >
          </p>
        </div>
        <!-- Decorative animated cyan hairline along the bottom edge of the card -->
        <div
          class="absolute bottom-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary-fixed-dim/40 to-transparent animate-pulse-cyan"
        ></div>
      </div>
      <!-- Decorative Elements -->
    </main>
    <!-- Page-specific behaviour: input focus glow + mock sign-in flow -->
    <script src="/js/login.js"></script>
  </body>
</html>
